<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SafeStep | Vincular WhatsApp con Evolution API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 36px;
      text-align: center;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      margin: 24px auto;
      display: inline-block;
      min-width: 256px;
      min-height: 256px;
    }
    .qr-img {
      width: 256px;
      height: 256px;
      display: block;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .badge-connecting {
      background: #fef3c7;
      color: #92400e;
    }
    .badge-open {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛡️ SafeStep WhatsApp Gateway</h1>
    <p>Escanea este código QR desde tu celular en <strong>WhatsApp > Dispositivos vinculados</strong> para habilitar las alertas médicas.</p>
    
    <div class="qr-box">
      <img id="qrImg" class="qr-img" src="" alt="Cargando QR...">
    </div>

    <div>
      <span id="statusBadge" class="badge badge-connecting">Esperando escaneo QR...</span>
    </div>
  </div>

  <script>
    async function checkQR() {
      try {
        const res = await fetch("http://localhost:8080/instance/connect/safestep", {
          headers: { "apikey": "safestep_evolution_key_2026" }
        });
        const data = await res.json();
        
        let b64 = null;
        if (data.base64) b64 = data.base64;
        else if (data.qrcode && data.qrcode.base64) b64 = data.qrcode.base64;

        if (b64) {
          if (!b64.startsWith("data:image")) {
            b64 = "data:image/png;base64," + b64;
          }
          document.getElementById("qrImg").src = b64;
        }

        // Consultar estado de la conexión
        const stRes = await fetch("http://localhost:8080/instance/connectionState/safestep", {
          headers: { "apikey": "safestep_evolution_key_2026" }
        });
        const stData = await stRes.json();
        if (stData.instance && stData.instance.state === "open") {
          document.getElementById("statusBadge").className = "badge badge-open";
          document.getElementById("statusBadge").innerText = "✓ ¡WhatsApp Vinculado con Éxito!";
        }
      } catch (e) {
        console.error(e);
      }
    }

    checkQR();
    setInterval(checkQR, 5000);
  </script>
</body>
</html>
