<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SafeStep | Vincular WhatsApp con Evolution API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 36px;
      text-align: center;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      margin: 24px auto;
      display: inline-block;
      min-width: 256px;
      min-height: 256px;
    }
    .qr-img {
      width: 256px;
      height: 256px;
      display: block;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .badge-connecting {
      background: #fef3c7;
      color: #92400e;
    }
    .badge-open {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛡️ SafeStep WhatsApp Gateway</h1>
    <p>Escanea este código QR desde tu celular en <strong>WhatsApp > Dispositivos vinculados</strong> para habilitar las alertas médicas.</p>
    
    <div class="qr-box" style="display:flex; align-items:center; justify-content:center; min-height:256px;">
      <div id="loader" style="color:#0284c7; font-weight:600;">⏳ Cargando código QR...</div>
      <img id="qrImg" class="qr-img" src="" alt="Código QR" style="display:none;">
    </div>

    <div style="margin-top: 15px;">
      <span id="statusBadge" class="badge badge-connecting">Obteniendo código QR...</span>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
      <button id="reloadBtn" onclick="fetchNewQR()" style="background:#0284c7; color:#fff; border:none; border-radius:10px; padding:10px 18px; font-weight:600; cursor:pointer;">🔄 Generar nuevo QR</button>
      <button id="resetBtn" onclick="resetInstance()" style="background:#dc2626; color:#fff; border:none; border-radius:10px; padding:10px 18px; font-weight:600; cursor:pointer;">⚠️ Reiniciar Sesión</button>
    </div>
  </div>

  <script>
    let isConnected = false;
    const API_BASE = "http://127.0.0.1:8080";
    const API_KEY = "safestep_evolution_key_2026";

    async function fetchNewQR() {
      const badge = document.getElementById("statusBadge");
      const img = document.getElementById("qrImg");
      const loader = document.getElementById("loader");
      const reloadBtn = document.getElementById("reloadBtn");

      if (reloadBtn) {
        reloadBtn.disabled = true;
        reloadBtn.innerText = "Cargando...";
      }
      if (badge) {
        badge.className = "badge badge-connecting";
        badge.innerText = "Obteniendo código QR...";
      }
      if (loader) loader.style.display = "block";
      if (img) img.style.display = "none";

      try {
        const res = await fetch(`${API_BASE}/instance/connect/safestep`, {
          headers: { "apikey": API_KEY }
        });
        const data = await res.json();
        
        let b64 = null;
        if (data.base64) b64 = data.base64;
        else if (data.qrcode && data.qrcode.base64) b64 = data.qrcode.base64;

        if (b64) {
          if (!b64.startsWith("data:image")) {
            b64 = "data:image/png;base64," + b64;
          }
          img.src = b64;
          img.style.display = "block";
          if (loader) loader.style.display = "none";
          if (badge) badge.innerText = "Listo. Escanéalo antes de que expire (~30 seg)";
        } else if (data.instance && data.instance.state === "open") {
          isConnected = true;
          if (badge) {
            badge.className = "badge badge-open";
            badge.innerText = "✓ ¡WhatsApp ya está vinculado!";
          }
          if (loader) loader.style.display = "none";
          if (img) img.style.display = "none";
          if (reloadBtn) reloadBtn.style.display = "none";
        }
      } catch (e) {
        console.error("Error al cargar QR:", e);
        if (loader) loader.innerText = "❌ Error conectando a Evolution API";
        if (badge) badge.innerText = "Error de red con Evolution API (127.0.0.1:8080)";
      } finally {
        if (reloadBtn) {
          reloadBtn.disabled = false;
          reloadBtn.innerText = "🔄 Generar nuevo QR";
        }
      }
    }

    async function checkState() {
      if (isConnected) return;
      try {
        const res = await fetch(`${API_BASE}/instance/connectionState/safestep`, {
          headers: { "apikey": API_KEY }
        });
        const data = await res.json();
        if (data.instance && data.instance.state === "open") {
          isConnected = true;
          const badge = document.getElementById("statusBadge");
          if (badge) {
            badge.className = "badge badge-open";
            badge.innerText = "✓ ¡WhatsApp Vinculado con Éxito!";
          }
          const img = document.getElementById("qrImg");
          if (img) img.style.opacity = "0.3";
          const reloadBtn = document.getElementById("reloadBtn");
          if (reloadBtn) reloadBtn.style.display = "none";
        }
      } catch (e) {
        // Ignorar errores de sondeo en segundo plano
      }
    }

    async function resetInstance() {
      if (!confirm("¿Deseas reiniciar la sesión de WhatsApp para empezar desde cero?")) return;
      const badge = document.getElementById("statusBadge");
      if (badge) badge.innerText = "Reiniciando sesión...";
      try {
        await fetch(`${API_BASE}/instance/logout/safestep`, {
          method: "DELETE",
          headers: { "apikey": API_KEY }
        });
        setTimeout(fetchNewQR, 2000);
      } catch(e) {
        alert("Error al reiniciar: " + e.message);
      }
    }

    // Cargar QR inicial
    fetchNewQR();

    // Sondear solo el estado de conexión sin regenerar el QR
    setInterval(checkState, 2500);
  </script>
</body>
</html>
